<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Boletas Energía Mineral{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=20260908-2">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  {% set path = request.url.path %}
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/">
        <span class="brand-kicker">Energía Mineral</span>
        Boletas
      </a>
      <nav class="site-nav" aria-label="Principal">
        <a href="/" class="nav-link{% if path == '/' %} is-current{% endif %}"{% if path == '/' %} aria-current="page"{% endif %}>Inicio</a>
        <a href="/dashboard" class="nav-link{% if path.startswith('/dashboard') %} is-current{% endif %}"{% if path.startswith('/dashboard') %} aria-current="page"{% endif %}>Tablero</a>
        <a href="/admin/folio-batches" class="nav-link{% if path.startswith('/admin/folio-batches') %} is-current{% endif %}"{% if path.startswith('/admin/folio-batches') %} aria-current="page"{% endif %}>Lotes de Folios</a>
        <a href="/review" class="nav-link{% if path.startswith('/review') %} is-current{% endif %}"{% if path.startswith('/review') %} aria-current="page"{% endif %}>Cola de Revisión</a>
        <a href="/admin/config" class="nav-link{% if path.startswith('/admin/config') %} is-current{% endif %}"{% if path.startswith('/admin/config') %} aria-current="page"{% endif %}>Configuración</a>
        <form method="post" action="/logout" class="logout-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
          <button type="submit" class="btn-logout">Salir</button>
        </form>
      </nav>
    </div>
  </header>
  <main id="contenido" class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v=20260908-2" defer></script>
</body>
</html>
