<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Boletas Energía Mineral{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Boletas Energía Mineral</a>
    <nav>
      <a href="/">Inicio</a>
      <a href="/dashboard">Tablero</a>
      <a href="/admin/folio-batches">Lotes de Folios</a>
      <a href="/admin/proveedores">Proveedores</a>
      <a href="/review">Cola de Revisión</a>
      <form method="post" action="/logout" style="display: inline;">
        <button type="submit" style="background: none; color: var(--accent); padding: 0; text-decoration: underline; cursor: pointer;">Salir</button>
      </form>
    </nav>
  </header>
  <main class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
