<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Boletas Energía Mineral</title>
  <link rel="stylesheet" href="/static/style.css?v=20260908-2">
  {% if clerk_configured %}
  <script async crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
  <script>
    window.__CLERK_PUBLISHABLE_KEY__ = {{ clerk_publishable_key|tojson|safe }};
  </script>
  {% endif %}
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-card panel {% if error %}is-error{% endif %}">
      <p class="login-brand">Energía Mineral</p>
      <h1>Iniciar sesión</h1>
      <p class="lede">Acceso al registro de boletas.</p>
      {% if not clerk_configured %}
        <div class="alert alert-error" role="alert">
          <p id="login-error">Clerk no está configurado. Establece CLERK_PUBLISHABLE_KEY y CLERK_SECRET_KEY en el entorno.</p>
        </div>
      {% else %}
        <div id="clerk-signin" data-next="{{ next }}"></div>
        <noscript>
          <p class="mt-3">Habilita JavaScript para iniciar sesión.</p>
        </noscript>
      {% endif %}
    </div>
  </main>
  {% if clerk_configured %}
  <script>
    (function () {
      "use strict";
      function onReady(fn){ if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',fn); } else { fn(); } }
      function showLoginError(message) {
        try {
          var card = document.querySelector('.login-card');
          if (!card) return;
          var alert = document.createElement('div');
          alert.className = 'alert alert-error';
          alert.setAttribute('role', 'alert');
          var p = document.createElement('p');
          p.id = 'login-error';
          p.textContent = message || 'No se pudo cargar el componente de inicio de sesión.';
          alert.appendChild(p);
          card.classList.add('is-error');
          // Insert the alert just below the lede paragraph if present
          var lede = card.querySelector('.lede');
          if (lede && lede.parentNode) {
            lede.parentNode.insertBefore(alert, lede.nextSibling);
          } else {
            card.appendChild(alert);
          }
        } catch (_) { /* ignore UI error */ }
      }
      function waitForClerk(timeoutMs) {
        return new Promise(function (resolve, reject) {
          var start = Date.now();
          (function poll() {
            if (window.Clerk) return resolve(window.Clerk);
            if (Date.now() - start > (timeoutMs || 6000)) return reject(new Error('timeout'));
            setTimeout(poll, 50);
          })();
        });
      }
      onReady(function () {
        waitForClerk(6000)
          .then(function () {
            return window.Clerk.load({ publishableKey: window.__CLERK_PUBLISHABLE_KEY__ });
          })
          .then(function () {
            var mountEl = document.getElementById('clerk-signin');
            if (!mountEl) return;
            var next = mountEl.getAttribute('data-next') || '/';
            window.Clerk.mountSignIn(mountEl, {
              signInUrl: window.location.origin + '/login',
              afterSignInUrl: next,
              redirectUrl: next
            });
          })
          .catch(function () {
            showLoginError('No se pudo cargar el inicio de sesión de Clerk. Recarga la página e inténtalo de nuevo. Si el problema persiste, contacta al administrador.');
          });
      });
    })();
  </script>
  {% endif %}
</body>
</html>
